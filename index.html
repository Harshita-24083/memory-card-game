<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory card</title>
    <style>
        body
        {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #board
        {
            display:grid;
            grid-template-columns: repeat(4,80px);
            gap:10px;
        }
        #board div
        {
            width: 80px;
            height: 80px;
            background-color: purple;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size:35px;
            border-radius: 10px;
           
        }
        #moves
        {
            height: 50px;
        }
        #restart
        {
            background-color: purple;
            color: white;
            height: 40px;
            width: 100px;
        }
       
    </style>
</head>
<body>
    <div id="board"></div>
    <h2 id="moves"></h2>
    <button id="restart">Restart</button>
    <script src="script.js"></script>
</body>
</html>
